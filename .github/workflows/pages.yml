# Repo is public — Pages is available; this workflow auto-enables it.
name: Deploy PWA to GitHub Pages

# Builds the web/ PWA and publishes it to GitHub Pages. The PWA then talks to
# your self-hosted JBrain server (entered on first run). Enable Pages in repo
# Settings → Pages → Source: GitHub Actions.

# Manual-only: auto-deploy on push to main is disabled (the PWA is served from the
# self-hosted server, so Pages is optional). Run it on demand from the Actions tab
# if you want to refresh the GitHub Pages copy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build PWA
        working-directory: web
        env:
          # Project Pages serve at https://<user>.github.io/<repo>/.
          # For a user/org site or custom domain, set VITE_BASE=/ .
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html   # SPA fallback for deep links
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
