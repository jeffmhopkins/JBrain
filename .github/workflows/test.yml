name: Tests

# The cross-domain test gate (see docs/testing-plan/PLAN.md §5). Two parallel,
# per-domain jobs — each enforces its OWN coverage floor (backend fail_under in
# server/pyproject.toml; frontend thresholds in web/vitest.config.ts). There is no
# combined gate: a backend-dominated combined number would be meaningless across the
# 15.6k/9k statement split. Locally the same checks run via `./jt cov`.
#
# Existing pages.yml / android-apk.yml workflows are untouched.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: backend (pytest)
    runs-on: ubuntu-latest
    # Pin fastembed's model cache to a stable path so we can cache it across runs (and so
    # the pre-warm step + pytest share it). The app reads this too — embeddings.py builds
    # TextEmbedding() with no cache_dir, so fastembed falls back to FASTEMBED_CACHE_PATH.
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      # Cache the embedding model (BAAI/bge-small-en-v1.5 via fastembed) so CI doesn't
      # re-download it from HuggingFace every run — a HF hiccup was timing the suite out
      # (test_foldback_coalesce loads the real model). Bump the key suffix if
      # EMBEDDING_MODEL (server/app/config.py) changes.
      - name: Cache the local embedding model
        uses: actions/cache@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5
      - name: Install backend deps
        # fastapi/pydantic MUST be installed before pytest collects, or import fails.
        # pywebpush (-> py-vapid/http-ece) is split out and best-effort: it doesn't always
        # build, the push module is import-guarded, and it must never fail the gate.
        run: |
          python -m pip install -U pip
          grep -v '^pywebpush' requirements.txt > /tmp/reqs-core.txt
          pip install -r /tmp/reqs-core.txt -r requirements-dev.txt
          pip install pywebpush==2.0.0 || echo "::warning::pywebpush unavailable; push tests will skip"
      # Warm the embedding model BEFORE pytest, with retries, so a transient HuggingFace
      # failure is retried here (longer backoff than the in-test fastembed retries, which
      # pytest-timeout was killing) instead of flaking the gate. On a cache hit this loads
      # from FASTEMBED_CACHE_PATH instantly. Best-effort: it never fails the job — pytest
      # still runs if warming couldn't complete.
      - name: Pre-warm the local embedding model
        run: |
          for i in 1 2 3 4 5; do
            if python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5'); print('embedding model ready')"; then
              exit 0
            fi
            echo "::warning::embedding warm attempt $i failed (HuggingFace hiccup?); retrying in $((i * 15))s…"
            sleep $((i * 15))
          done
          echo "::warning::could not pre-warm the embedding model after retries; the suite will try during tests"
      - name: Test + coverage gate
        # Full suite (incl. the `concurrency` tier) so coverage is the true number;
        # fail_under=75 lives in pyproject.toml. Locally `./jt` default skips the
        # concurrency tier for a faster inner loop; CI keeps those regression tests in.
        run: python -m pytest --cov=app --cov-report=term-missing

  front:
    name: frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck (part of the gate)
        run: npx tsc -b
      - name: Test + coverage gate
        # thresholds (floor 7) live in vitest.config.ts.
        run: npm run test:cov

  e2e:
    name: system / e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Install API deps (pywebpush best-effort) + build the PWA
        run: |
          python -m pip install -U pip
          grep -v '^pywebpush' server/requirements.txt > /tmp/reqs-core.txt
          pip install -r /tmp/reqs-core.txt -r server/requirements-dev.txt
          pip install pywebpush==2.0.0 || echo "::warning::pywebpush unavailable"
          npm --prefix web ci && npm --prefix web run build
      - name: Install Playwright (chromium + system deps)
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: Run system tests (real PWA + API, LLM faked at the boundary)
        run: cd e2e && CI=1 npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }

  android:
    name: android (jvm unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: android-actions/setup-android@v3
      - name: Robolectric JVM unit tests (no emulator)
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with: { name: android-test-report, path: android/app/build/reports/tests, retention-days: 7 }

  # Informational only (never blocks merge): how well a PR's CHANGED lines are tested.
  # This is the "new features ship with tests" signal — reported to the run summary.
  diff-coverage:
    name: diff coverage (informational)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # need the base branch to diff against
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Install deps + diff-cover
        run: |
          grep -v '^pywebpush' server/requirements.txt > /tmp/reqs-core.txt
          pip install -r /tmp/reqs-core.txt -r server/requirements-dev.txt diff-cover
          pip install pywebpush==2.0.0 || true
          npm --prefix web ci
      - name: Generate coverage (backend xml + frontend lcov)
        run: |
          ( cd server && python -m pytest -m "not concurrency" --cov=app --cov-report=xml ) || true
          ( cd web && npx vitest run --coverage --coverage.reporter=lcovonly ) || true
      - name: Diff coverage of changed lines (never fails — --fail-under=0)
        run: |
          base="origin/${{ github.base_ref }}"
          {
            echo "## Diff coverage — how well this PR's *changed* lines are tested"
            echo "_Informational; does not block merge. Aim to keep new code well-covered._"
            echo "### Backend"; echo '```'
            diff-cover server/coverage.xml --compare-branch "$base" --fail-under=0 2>/dev/null || echo "(no backend coverage delta)"
            echo '```'; echo "### Frontend"; echo '```'
            diff-cover web/coverage/lcov.info --compare-branch "$base" --fail-under=0 2>/dev/null || echo "(no frontend coverage delta)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
