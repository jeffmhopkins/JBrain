# Declarative action: fold entry CHANGES since the last run (new, edited, OR
# deleted entries) into the dedicated KB layer, then post a review card. Edits are
# reconciled and deletions clean up the articles that cited the removed entry. The
# LLM prompt-building + JSON parsing lives in the wiki_plan primitive; composition
# (query changes → plan → write each → watermark → review) is here. The watermark
# is a timestamp (max changed_at processed), so edits/removals are caught too.
#
# Fix vs. the old Python: the watermark only advances when the plan is non-empty,
# so a failed/empty LLM response no longer skips those entries forever.
#
# config keys:
#   batch_limit   — max new entries per run (default 50)
#   instructions  — extra guidance appended to the synthesis prompt
#   review        — set to false to suppress the review card (default on)
type: synthesize_wiki
config:
  - { key: batch_limit, label: Max entries per run, type: number, help: "Default 20 (smaller = more thorough per run)" }
  - { key: instructions, label: Extra guidance, type: textarea }
  - { key: review, label: Post a review card, type: review, default: true }
steps:
  - id: wm
    do: get_meta
    with: { key: "wiki_synth:since", default: "" }

  - id: entries
    do: query_entry_changes      # new, edited, OR deleted entries since the watermark
    with:
      since: "{{ wm }}"
      limit: "{{ config.batch_limit | default(20) }}"
    stop_when_empty: "no entry changes since last run"

  - id: kb
    do: query_notes
    with: { kind: kb, limit: 50 }   # cold-start fallback; wiki_plan retrieves the relevant ones

  - id: plan
    do: wiki_plan
    with:
      entries: "{{ entries }}"
      existing_kb: "{{ kb }}"
      instructions: "{{ config.instructions | default(none) }}"

  # Citation safety gate (M1): only write articles whose footnote citations are
  # well-formed; malformed ones are quarantined (not written) and surfaced below,
  # so a dropped/duplicated citation can never silently break delete-reconcile.
  - id: checked
    do: validate_citations
    with: { articles: "{{ plan }}" }

  # Record that synthesis CONSIDERED these entries (per-entry watermark), so the KB
  # coverage check won't later re-feed ones it intentionally produced no fact for.
  - do: mark_evaluated
    with: { ids: "{{ entries | map(attribute='id') | list }}" }

  - id: write
    for_each: "{{ checked.valid }}"
    steps:
      - do: write_note
        with:
          title: "{{ item.title }}"
          content_md: "{{ item.content_md }}"
          kind: kb

  - do: set_meta
    when: "{{ checked.valid }}"   # advance the watermark only when something was written
    with:
      key: "wiki_synth:since"
      value: "{{ entries | map(attribute='changed_at') | max }}"

  - do: create_review
    when: "{{ config.review != false and checked.valid }}"
    with:
      title: "{{ config.review.title | default('Knowledge base updated') }}"
      message: "Updated topics: {{ checked.valid | map(attribute='title') | join(', ') }}"
      link_title: "{{ checked.valid[0].title }}"

  - do: create_review
    when: "{{ checked.quarantined }}"
    with:
      title: "Citations need a look"
      message: "{{ checked.bad }} synthesized article(s) had malformed citations and were NOT saved: {{ checked.quarantined | map(attribute='title') | join(', ') }}. They'll be retried next run."
