# Declarative action: KNOWLEDGE-BASE MAINTENANCE (component 3).
#
# The stateful counterpart to the full rebuild (wiki_build). Instead of rewriting the KB
# from scratch, it walks the articles that got a NEW talk item since the last pass (a
# watermark) — the owner's fresh directives and the conflicts/questions/todos the writer
# raised — and addresses each against the article's own cited sources: applies directives,
# reconciles conflicts, answers questions. It NEVER invents; an item it can't settle
# faithfully is left open. (Articles whose SOURCES changed are refreshed by the incremental
# update pass instead, which re-examines all of an article's open items — so maintenance
# need not re-grind them.)
#
# Each changed article is saved (versioned, undoable) and the items it resolved are
# closed WITH a note of how (shown in the article's AI-talk log). Anything still open
# becomes a Review card so you can finish it by hand. Requires an Anthropic key.
#
# config keys:
#   limit  — max articles to maintain per run (default 20; re-run to drain more)
#   review — post review cards (default true)
type: wiki_maintain
category: Knowledge base
config:
  - { key: limit, label: Max articles per run, type: number, default: 20 }
  - { key: review, label: Post review cards, type: review, default: true }
steps:
  # 1. Address open talk items on each article that has them.
  - id: maint
    do: wiki_maintain
    with: { limit: "{{ config.limit | default(20) }}" }

  # 1b. Safety reconciliation after edits (cheap, no LLM): refresh disambiguation pages,
  #     then sweep any cross-link that has gone dead. Mirrors the full build's post-write
  #     passes so maintenance can't leave the KB inconsistent. Only runs if it changed something.
  - do: write_disambiguation
    when: "{{ maint.changed }}"
  - do: flag_dead_links
    when: "{{ maint.changed }}"

  # 1c. Keep MedlinePlus drug references current on medication articles (RxNorm-resolved,
  #     link-only; exact -> auto-link, approximate -> a talk todo to confirm). Cached, no LLM.
  - do: link_medications

  # 1d. Demote any non-actionable "stub / needs more notes / revisit later" talk todos to
  #     inert notes (+ cap) so they stop nagging the maintenance pass and posting Review cards.
  - do: tidy_talk

  # 1d². Link-label hygiene (deterministic, no LLM): drop redundant/mismatched [[link|alias]]
  #      labels so links render the article's clean short name (e.g. "Jeffrey Mark Hopkins",
  #      not "People/Jeffrey Mark Hopkins") — keeps freshly-written links tidy without a rebuild.
  - do: normalize_link_labels

  # 1e. Keep saved geofences reconciled with their kb/Places articles (location box + cross-link).
  - do: link_places

  # 2. Summary card of what the pass did.
  - do: create_review
    when: "{{ config.review != false }}"
    with:
      title: "Knowledge base maintenance"
      message: "Maintained {{ maint.articles }} article(s): updated {{ maint.changed }}, resolved {{ maint.resolved }} open item(s)."
      link_title: "kb/_index"

  # 3. Re-open a review session for whatever is STILL open (couldn't be settled from sources).
  - do: review_open_talk
    when: "{{ config.review != false }}"

  # 4. Read-only taxonomy-health check — cards a "Reorganize recommended" only when overdue.
  - do: taxonomy_health
