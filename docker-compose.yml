# JBrain — two services: Caddy (TLS + reverse proxy) and the API (FastAPI +
# built PWA). State lives in two named volumes so it is trivial to back up.
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/brain.db
    volumes:
      - brain-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Optional auto-updater. Enabled via COMPOSE_PROFILES=autoupdate in .env.
  # Applies updates requested from the PWA without any host intervention.
  # Trade-off: it mounts the Docker socket and the project directory.
  updater:
    image: docker:27-cli
    profiles: ["autoupdate"]
    restart: unless-stopped
    working_dir: /repo
    command: sh /repo/updater/run.sh
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-jbrain}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/repo
      - brain-data:/data

volumes:
  brain-data:
  caddy-data:
  caddy-config:
