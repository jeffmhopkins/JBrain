<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Swipe-right to hide — interactive mockup</title>
<style>
  :root{
    --bg:#111315; --bg-elev:#161a1c; --bg-elev-2:#1c2123; --border:#2a2f31;
    --text:#d8dcde; --text-dim:#828a8e; --accent:#7f9aa6; --accent-soft:rgba(127,154,166,0.14);
    --ok:#5fb06f; --radius:8px;
    --min-dx:55px;            /* SWIPE_MIN_DX from web/src/swipeGesture.ts */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0;background:#0a0c0d;color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 14px 60px;}
  h1{font-size:19px;font-weight:600;margin:0 0 2px;text-align:center;}
  .sub{color:var(--text-dim);font-size:13px;margin:0 0 18px;text-align:center;max-width:520px;line-height:1.5;}

  /* ---- controls ---- */
  .controls{display:flex;flex-direction:column;gap:10px;width:340px;max-width:100%;margin-bottom:16px;}
  .seg{display:flex;background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:4px;gap:4px;}
  .seg button{flex:1;font:inherit;font-size:12px;cursor:pointer;border:0;border-radius:7px;
              padding:8px 4px;background:transparent;color:var(--text-dim);line-height:1.2;}
  .seg button .k{display:block;font-weight:700;font-size:13px;color:var(--text);}
  .seg button.active{background:var(--accent);}
  .seg button.active .k,.seg button.active{color:#0a0c0d;}
  .row2{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;user-select:none;}
  .toggle input{width:16px;height:16px;accent-color:var(--accent);}
  .reset{font:inherit;font-size:12px;cursor:pointer;background:var(--bg-elev-2);color:var(--text);
         border:1px solid var(--border);border-radius:8px;padding:7px 14px;}
  .desc{font-size:12.5px;color:var(--text-dim);line-height:1.5;min-height:34px;text-align:center;
        width:340px;max-width:100%;margin-bottom:14px;}
  .desc b{color:var(--accent);font-weight:600;}

  /* ---- phone ---- */
  .phone{width:340px;max-width:100%;height:520px;background:var(--bg-elev);border:1px solid var(--border);
         border-radius:22px;padding:14px 12px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .phone .hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:11px;color:var(--text-dim);
               pointer-events:none;}
  .thread{flex:1;display:flex;flex-direction:column;gap:9px;overflow-y:auto;padding:4px 2px 30px;}

  /* a swipeable unit (entry card = bubble + chip, or a lone assistant bubble) */
  .card{position:relative; touch-action:pan-y; will-change:transform; cursor:grab;}
  .card.grabbing{cursor:grabbing;}
  .card .inner{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1;
               background:var(--bg-elev);}      /* opaque so the reveal sits behind it */
  .card.user .inner{align-items:flex-end;}
  .card.asst .inner{align-items:flex-start;}

  .msg{max-width:86%;padding:9px 12px;border-radius:var(--radius);font-size:13.5px;line-height:1.45;
       border:1px solid var(--border);white-space:pre-wrap;}
  .msg.user{background:var(--accent-soft);}
  .msg.asst{background:var(--bg-elev);max-width:100%;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);
        border:1px solid var(--border);border-radius:var(--radius);padding:5px 9px;}
  .chip .ok{color:var(--ok);font-weight:700;}

  /* the colored "Hide" background revealed under a card (mode C) */
  .reveal{position:absolute;inset:0;z-index:0;display:none;align-items:center;justify-content:flex-start;
          padding-left:16px;gap:8px;color:var(--accent);font-size:13px;font-weight:600;
          background:rgba(127,154,166,.20);border:1px solid var(--accent);border-radius:var(--radius);}
  .card.revealing .reveal{display:flex;}

  /* animated leave (modes B & C dismissal) */
  .card.anim{transition:transform .19s ease, opacity .19s ease;}
  .card.springing{transition:transform .22s cubic-bezier(.2,.8,.3,1);}
  .card.leaving{transform:translateX(120%)!important;opacity:0;}
  /* collapse the vertical gap after the card has slid away */
  .card.collapsing{transition:max-height .16s ease, margin .16s ease, opacity .16s ease;
                   max-height:0!important;margin-top:-9px!important;opacity:0;overflow:hidden;}
  .card.gone{display:none;}

  /* ---- undo toast ---- */
  .toast{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;display:flex;align-items:center;
         justify-content:space-between;background:var(--bg-elev-2);border:1px solid var(--border);
         border-radius:var(--radius);padding:10px 14px;font-size:13px;
         transform:translateY(140%);transition:transform .2s ease;box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .toast.show{transform:translateY(0);}
  .toast .undo{font:inherit;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;
               background:transparent;border:1px solid var(--border);border-radius:6px;padding:4px 12px;}
</style>
</head>
<body>
  <h1>Swipe-right to hide a card</h1>
  <p class="sub">Drag any card to the <b>right</b> (mouse or touch) to hide it from view. The note's DB row is never touched — <b>Reset</b> brings everything back. Pick a style below to feel the difference.</p>

  <div class="controls">
    <div class="seg" id="modes">
      <button data-mode="A"><span class="k">A</span>Instant<br>(current)</button>
      <button data-mode="B"><span class="k">B</span>Slide&nbsp;+ fade</button>
      <button data-mode="C" class="active"><span class="k">C</span>Live drag<br>+ reveal</button>
    </div>
    <div class="row2">
      <label class="toggle"><input type="checkbox" id="undo" /> “Undo” toast (option&nbsp;D)</label>
      <button class="reset" id="reset">↺ Reset</button>
    </div>
  </div>
  <div class="desc" id="desc"></div>

  <div class="phone">
    <div class="thread" id="thread">
      <!-- cards injected by JS so Reset can rebuild them -->
    </div>
    <div class="hint">drag a card to the right →</div>
    <div class="toast" id="toast"><span>Hidden</span><button class="undo" id="undoBtn">Undo</button></div>
  </div>

<script>
// Mirrors web/src/swipeGesture.ts so the mockup's thresholds match production.
const SWIPE_MIN_DX = 55;   // px of rightward travel required
const EDGE_GUARD   = 28;   // px from the left screen edge reserved for the OS back gesture

const DESCS = {
  A: "<b>A — Instant hide (current):</b> the card vanishes the moment a qualifying swipe is detected. No animation; matches today's swipe-left exactly.",
  B: "<b>B — Slide-out + fade:</b> on release past the threshold the card slides right and fades (~190ms), then the gap collapses. Gesture-detected — the card does NOT track your finger.",
  C: "<b>C — Live drag + reveal:</b> the card follows your finger and a “Hide” panel shows behind it. Release past the threshold to dismiss; otherwise it springs back.",
};

let mode = "C";
let undoEnabled = false;
let lastHidden = null;       // {card} for the Undo toast
let toastTimer = null;

const thread = document.getElementById("thread");
const phone  = document.querySelector(".phone");
const desc   = document.getElementById("desc");
const toast  = document.getElementById("toast");

const CARDS = [
  { type:"user", body:"Buy milk",                 chip:"daily/2026-06-11" },
  { type:"asst", body:"Got it — saved under notes/daily. Anything else?" },
  { type:"user", body:"Call dentist at 3pm",      chip:"daily/2026-06-11" },
  { type:"user", body:"Picked up the dry cleaning", chip:"daily/2026-06-11" },
  { type:"user", body:"Idea: weekend hiking trip", chip:"daily/2026-06-11" },
];

function buildThread(){
  thread.innerHTML = "";
  for(const c of CARDS){
    const card = document.createElement("div");
    card.className = "card " + (c.type === "user" ? "user" : "asst");
    const reveal = `<div class="reveal">👁 Hide</div>`;
    const chip = c.chip ? `<span class="chip"><span class="ok">✓</span> Saved: ${c.chip}</span>` : "";
    card.innerHTML = reveal +
      `<div class="inner"><div class="msg ${c.type}">${c.body}</div>${chip}</div>`;
    wire(card);
    thread.appendChild(card);
  }
}

function wire(card){
  let startX = 0, startY = 0, dragging = false, dx = 0, decided = false;

  card.addEventListener("pointerdown", (e) => {
    if (card.dataset.busy) return;
    dragging = true; decided = false; dx = 0;
    startX = e.clientX; startY = e.clientY;
    card.setPointerCapture(e.pointerId);
    card.classList.add("grabbing");
    card.classList.remove("anim","springing");
  });

  card.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    const dy = e.clientY - startY;
    // Lock to a horizontal gesture once it's clearly horizontal (mode C tracks the finger).
    if (!decided && Math.abs(dx) > 6) decided = Math.abs(dx) > Math.abs(dy);
    if (mode === "C" && dx > 0) {
      card.classList.add("revealing");
      card.style.transform = `translateX(${dx}px)`;
      card.style.opacity = String(Math.max(0.35, 1 - dx / 320));
    }
  });

  card.addEventListener("pointerup", (e) => {
    if (!dragging) return;
    dragging = false;
    card.classList.remove("grabbing");
    const dy = e.clientY - startY;
    const phoneLeft = phone.getBoundingClientRect().left;
    const ok = dx >= SWIPE_MIN_DX                       // clear rightward travel
            && Math.abs(dx) >= Math.abs(dy) * 1.5       // horizontal-dominant, not a scroll
            && (startX - phoneLeft) >= EDGE_GUARD;      // not from the OS back-gesture edge
    if (ok) { dismiss(card); }
    else    { springBack(card); }
  });

  card.addEventListener("pointercancel", () => { dragging = false; springBack(card); });
}

function springBack(card){
  card.classList.remove("revealing");
  card.classList.add("springing");
  card.style.transform = "translateX(0)";
  card.style.opacity = "1";
  setTimeout(() => card.classList.remove("springing"), 240);
}

function dismiss(card){
  card.dataset.busy = "1";
  card.classList.remove("revealing","springing");
  if (mode === "A"){
    collapse(card, /*instant=*/true);
    return;
  }
  // B & C: slide the card off to the right, then collapse the gap it left.
  card.classList.add("anim","leaving");
  card.style.transform = "";        // let the .leaving class drive translateX(120%)
  card.style.opacity = "";
  setTimeout(() => collapse(card, false), 190);
}

function collapse(card, instant){
  if (instant){
    card.classList.add("gone");
    afterHide(card);
    return;
  }
  card.style.maxHeight = card.offsetHeight + "px";
  requestAnimationFrame(() => {
    card.classList.add("collapsing");
    setTimeout(() => { card.classList.add("gone"); afterHide(card); }, 170);
  });
}

function afterHide(card){
  if (undoEnabled) showToast(card);
}

function restore(card){
  card.classList.remove("gone","collapsing","leaving","anim","springing");
  card.style.maxHeight = ""; card.style.transform = ""; card.style.opacity = "";
  delete card.dataset.busy;
}

/* ---- undo toast ---- */
function showToast(card){
  lastHidden = card;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 4000);
}
document.getElementById("undoBtn").addEventListener("click", () => {
  if (lastHidden) restore(lastHidden);
  lastHidden = null;
  toast.classList.remove("show");
});

/* ---- controls ---- */
document.getElementById("modes").addEventListener("click", (e) => {
  const btn = e.target.closest("button"); if (!btn) return;
  mode = btn.dataset.mode;
  [...e.currentTarget.children].forEach(b => b.classList.toggle("active", b === btn));
  desc.innerHTML = DESCS[mode];
});
document.getElementById("undo").addEventListener("change", (e) => { undoEnabled = e.target.checked; });
document.getElementById("reset").addEventListener("click", () => {
  toast.classList.remove("show"); lastHidden = null; buildThread();
});

desc.innerHTML = DESCS[mode];
buildThread();
</script>
</body>
</html>
