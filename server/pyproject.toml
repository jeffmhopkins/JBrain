# Backend test + coverage config (see ../docs/testing-plan/PLAN.md §4.1).
# Coverage is opt-in via `--cov` (CI / `./jt cov`); plain `pytest` stays fast.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",                       # summarize all non-passing outcomes
    "--strict-markers",          # an unknown @pytest.mark.* is an error (enforces the taxonomy)
    "--import-mode=importlib",
]
markers = [
    "unit: fast, isolated; no app wiring, DB init, or real network",
    "integration: temp-SQLite + TestClient/service wiring; LLM & embeddings mocked",
    "concurrency: real threads / on-disk WAL contention / background workers; run serially",
    "flows: validates workflows/*.yaml + actions/*.yaml (schema, cron, primitive registry)",
]
# Kill a wedged async/polling test instead of hanging CI (pytest-timeout; per-test).
timeout = 120
timeout_method = "thread"

# Docstring lint — honor-system, like the tests (CI reports, doesn't block).
# Scoped to docstrings only (the `D`/pydocstyle rules); run it with:
#   cd server && ruff check app
# Google convention is the house standard (see CLAUDE.md → "Docstrings").
[tool.ruff.lint]
select = ["D"]
# Relaxed for this repo's compact docstring house style:
#   D205 — allow a wrapped multi-line summary without a forced blank line before the body
#   D301 — allow escaped sequences (e.g. '\n') shown literally in explanatory prose
ignore = ["D205", "D301"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests follow their own conventions; don't require docstrings there.
"tests/**" = ["D"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# FLOOR, not a target — pinned just under the measured baseline so adopting the
# standard never reds CI without a code change. Ratchet UP as coverage rises;
# never set above actual. (See docs/coverage-audit for the weak modules to lift.)
fail_under = 79
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
