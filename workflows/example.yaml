# Example JBrain workflow. Files here are ingested into the DB on boot and can
# then be edited in the PWA (an edit there locks the row from repo re-ingest).
#
# Disabled by default — enable it in the PWA, or set `enabled: true` and redeploy.
key: example-daily-note
name: Example — daily note stub
enabled: false

# Triggers: an event fired by the app, an interval, or a cron expression.
trigger:
  type: schedule
  # interval_seconds: 86400        # every ~24h, OR:
  cron: "0 7 * * *"                # 07:00 every day, in the server's TZ

action:
  type: append_to_note
  config:
    title: Daily Note
    text: "## {date}\n\n- "
