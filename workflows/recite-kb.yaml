# Manual citation cleanup. Reformats existing KB articles from the old inline-cite
# style to the house footnote style and STAGES the rewrites for you to approve in
# Assisted chat. Run it from Advanced → Workflows → Run now; re-run to drain the
# backlog (10 articles per run). It never fires on its own.
#
# interval_seconds: 0 makes schedule_due() return False, so it is manual-only.
key: recite-kb
name: Citation cleanup (KB)
enabled: true

trigger:
  type: schedule
  interval_seconds: 0

action:
  type: recite_kb
  config:
    batch_limit: 10
