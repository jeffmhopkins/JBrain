# Continuous knowledge-base synthesis.
#
# On a schedule (≈daily; also run on demand from the Workflows page), looks at
# all entries created since the last run, has Claude fold their durable
# knowledge into a dedicated Knowledge Base layer (kind='kb' notes) that links
# back to the source entries, and posts a Review card summarising what changed.
#
# Auto-applies — every change is versioned and undoable. Requires an Anthropic
# key (skips with an error if none). Browse the result via Wiki → Knowledge base.
key: wiki-synthesis
name: Knowledge-base synthesis
enabled: true

trigger:
  type: schedule
  interval_seconds: 86400   # ~daily

action:
  type: synthesize_wiki
  config:
    batch_limit: 50
    review:
      title: "Knowledge base updated"
